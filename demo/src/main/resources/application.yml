server:
  port: 8081          # 用 8081，把 8080 让给我的参考项目，避免两个服务抢端口

spring:
  application:
    name: campus-rag
  # ---------- 加载本机私有配置 ----------
  # application-local.yml 里放 key、密码这类不能进 Git 的东西。
  # optional: 表示这个文件不存在也能启动（别人 clone 你的项目时不会被卡住）。
  config:
    import: optional:classpath:application-local.yml
  datasource:
      url: jdbc:mysql://127.0.0.1:3306/campus_rag?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      username: root
      password: "123456"      # 引号必须加，不加 YAML 会当成数字
  servlet:
    multipart:        # 文件上传大小限制，不写的话默认 1MB，传大文件会报错
      max-file-size: 20MB
      max-request-size: 25MB

campus:
  upload-dir: ./data/uploads   # 上传的文件存这里
  split:
    size: 220                  # 每块目标 220 字（先照课程默认值，后面用实验来定）
    overlap: 50                # 相邻块重叠 50 字
  # ---------- 检索方式 ----------
  retrieval:
    mode: ${RETRIEVAL_MODE:hybrid}      # vector / bm25 / hybrid。hybrid 默认，因为实测比单路好
    # ---------- 拒答阈值（E 方案，见 docs/09）----------
    # 精排分低于它 → 不调大模型，直接回"暂未收录"。0 表示不启用。
    # 依据（2026-11-22 实测 36 道题 + 8 道探针题，见 docs/09-拒答阈值.md）：
    #   32 道可答题最低 0.2004；4 道"库里没有"题最高 0.0025 → 取 0.10（留 0.05 以上余量）

    # 精排分低于它就不调大模型，直接拒答（省一次调用，0.44s 返回）。
    # 2026-11-22 二次标定：阈值是「链路属性」，加了「展开邻居」之后精排分整体被稀释，
    # 原来按「单块」标定的 0.10 会误杀 9 道本来能答的题（最低 0.0096）。
    # 在 118 道应答题 + 2 道无答案题上重新扫：0.015 时误拒 2 道、仍能拦住真正无关的问句。
    min-score-rerank: ${RETRIEVAL_MIN_SCORE_RERANK:0.015}
    # 没开精排时用这个（混合 RRF 分，量级只有 0.0x，不能和精排分混用）
    min-score-hybrid: ${RETRIEVAL_MIN_SCORE_HYBRID:0.0}
    hybrid-w-vector: ${HYBRID_W_VECTOR:0.2}   # 混合时向量那一路的权重，BM25 那一路是 0.8
    # 为什么向量只给 0.2？实测（414 块、真 bge-m3 向量）纯向量在"列举型"问题上漏块，
    # 而中文校园规章这种文本，字面重叠度很高，BM25 更稳。这个数是可调的实验参数。
    # ---------- 自适应融合（动态权重，见 docs/13）----------
    # 硬改写题（"借的书忘还了怎么算"）BM25 打不出分，固定 0.8 权重会把向量排对的结果挤掉。
    # 打开后：先看 BM25 信号强弱，弱就把权重让给向量。
    # 注意：这三项必须在 retrieval 下面（之前误写在 campus 下，等于没生效）
    adaptive: ${RETRIEVAL_ADAPTIVE:false}
    bm25-strong-avg: ${RETRIEVAL_BM25_STRONG_AVG:1.5}   # BM25 最高分÷查询词数 ≥ 它算"信号足够"
    weak-w-vector: ${RETRIEVAL_WEAK_W_VECTOR:0.7}       # 信号弱时向量权重上调到多少
  # ---------- 查询改写（把学生口语翻译成规章书面语，见 docs/14）----------
  rewrite:
    enabled: ${REWRITE_ENABLED:false}          # 默认关；关掉时检索行为与之前完全一致
    timeout-seconds: ${REWRITE_TIMEOUT_SECONDS:8}
    cache-size: ${REWRITE_CACHE_SIZE:500}      # 同一问句第二次改写 0 成本
  context:                                    # 多轮对话：带多少历史（由 ContextAssembler 读取）
    enabled: ${CONTEXT_ENABLED:true}          # 关掉就退回单轮行为，用于对比
    turns: ${CONTEXT_TURNS:3}                 # 带最近几轮（1 轮 = 问 + 答）
    max-chars-per-msg: ${CONTEXT_MAX_CHARS_PER_MSG:120}   # 单条历史截断长度
    max-total-chars: ${CONTEXT_MAX_TOTAL_CHARS:600}       # 历史总字数上限，防止历史挤掉【资料】
  embedding:
    provider: ${EMBEDDING_PROVIDER:openai}   # openai = 真模型；hash = 离线假向量（还没写）
    model: ${EMBEDDING_MODEL:BAAI/bge-m3}    # 硅基流动上的免费向量模型
    dim: ${EMBEDDING_DIM:1024}               # bge-m3 的维度，写错会报"维度不符"
    base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn/v1}
    api-key: ${EMBEDDING_API_KEY:}           # 留空没关系，真正的值在 application-local.yml
    batch-size: 16                           # 一次请求发多少条
  llm:
    # 两段式生成：先只摘原句，再只用原句组答案（docs/16）。关掉可回退单段式做对比实验
    two-stage: ${LLM_TWO_STAGE:false}
    base-url: ${LLM_BASE_URL:https://api.deepseek.com/v1}
    model: ${LLM_MODEL:deepseek-chat}        # DeepSeek 的便宜模型，够用
    api-key: ${DEEPSEEK_API_KEY:}            # 真正的值在 application-local.yml
    temperature: 0.2                         # 低温度 = 更保守、更少胡说
    max-tokens: 800
    timeout-seconds: 60
  # ---------- 精排（rerank）----------
  # 粗排（向量/BM25）只看"像不像"，精排（Cross-Encoder）看"这段能不能回答问题"。
  # 两道 badcase（正确块排第 4 名）就是靠它修。
  rerank:
    enabled: ${RERANK_ENABLED:false}          # 关掉时检索照常工作，只是没有精排这一步
    base-url: ${RERANK_BASE_URL:https://api.siliconflow.cn/v1}
    api-key: ${RERANK_API_KEY:}               # 真正的值在 application-local.yml
    model: ${RERANK_MODEL:BAAI/bge-reranker-v2-m3}
    candidates: 10                            # 送给精排的候选数（badcase 在第 4 名，10 足够）
    max-doc-chars: 600                        # 单条文档截断长度
    timeout-seconds: 15                       # 超时就降级为粗排结果

logging:
  level:
    com.campus.rag: debug      # 自己包的日志打详细点，方便看程序走到哪一步

  # ---------- 登录与权限 ----------
  # secret 是签名钥匙：换掉它，所有已发出的令牌立即失效。
  # 生产环境必须用环境变量注入（AUTH_SECRET），绝不能把真钥匙提交进 Git。
  auth:
    secret: ${AUTH_SECRET:dev-only-change-me-in-production}
    expire-minutes: ${AUTH_EXPIRE_MINUTES:720}   # 令牌有效期，默认 12 小时
